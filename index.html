<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Chart Analyzer</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{color-scheme:dark;--bg:#0c1014;--pn:#141a21;--ln:#232c36;--tx:#e6ebf0;--mu:#8795a3;--up:#2fc48d;--dn:#ef5a5a;--gd:#e3b341;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--ln);background:var(--pn)}
h1{font-size:16px;margin:0 10px 0 0;font-weight:700;letter-spacing:.2px}
select,button,label.btn{background:#1c242d;color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:7px 11px;font:inherit;cursor:pointer}
button.go{background:var(--gd);color:#16120a;border-color:var(--gd);font-weight:700}
button:focus-visible,select:focus-visible,label.btn:focus-within{outline:2px solid var(--gd);outline-offset:2px}
input[type=file]{display:none}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;padding:12px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:12px}
.card h2{font-size:13px;margin:0 0 8px;color:var(--mu);font-weight:600}
#chartwrap{height:560px;padding:0;position:relative}
canvas{width:100%;height:100%;display:block}
#side{display:flex;flex-direction:column;gap:12px}
.bar{display:flex;height:30px;border-radius:6px;overflow:hidden;font-weight:700}
.bar div{display:flex;align-items:center;padding:0 10px;color:#06130d;transition:width .4s}
#bb{background:var(--up)}#sb{background:var(--dn);justify-content:flex-end;color:#1b0707}
.row{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:4px 3px;text-align:left;border-bottom:1px solid var(--ln)}th{color:var(--mu);font-weight:600}
.scroll{overflow-x:auto}
.gauge{height:10px;background:#1c242d;border-radius:5px;overflow:hidden}.gauge div{height:100%;background:var(--gd);transition:width .4s}
.warn{background:#2a2312;border:1px solid #5a4a16;color:#f0d78a;border-radius:6px;padding:8px 10px}
.verdict{font-size:22px;font-weight:800;text-align:center;padding:10px;border-radius:8px;margin-bottom:8px}.verdict.BUY{background:#143a2b;color:var(--up)}.verdict.SELL{background:#3d1717;color:var(--dn)}.verdict.WAIT{background:#2a2312;color:#f0d78a}
#tabs{position:absolute;top:8px;left:8px;z-index:5;display:flex;gap:6px}#tabs button{padding:4px 9px;font-size:12px}
footer{padding:4px 14px 18px;color:var(--mu);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>AI Chart Analyzer</h1>
  <select id="pair" aria-label="Pair"><option>XAUUSD</option><option>EURUSD</option><option>GBPUSD</option><option>USDJPY</option><option>BTCUSD</option></select>
  <select id="tf" aria-label="Timeframe"><option>1m</option><option>5m</option><option selected>15m</option><option>1H</option><option>4H</option><option>1D</option></select>
  <button class="go" id="go">Analyze Now</button>
  <label class="btn">CSV fallback<input type="file" id="csv" accept=".csv,.txt"></label>
  <button id="demo">Load demo data</button>
  <label class="mu"><input type="checkbox" id="auto"> Auto every 60s</label>
</header>
<main>
  <section class="card" id="chartwrap"><div id="tabs"><button id="t1">Analysis chart</button><button id="t2">TradingView</button></div><div id="lw" style="height:100%;width:100%"></div><div id="tv" style="height:100%;width:100%;display:none"></div></section>
  <aside id="side"><div class="card" id="out"><div class="warn">Press Analyze Now to pull live candles.</div></div></aside>
</main>
<footer id="foot"></footer>
<script>
"use strict";
let candles=[], source="none", lastAn=null;
const $=id=>document.getElementById(id);

/* ---------- Indicators ---------- */
function ema(a,p){const o=Array(a.length).fill(NaN),k=2/(p+1);let f=a.findIndex(v=>!isNaN(v));if(f<0||a.length-f<p)return o;
 let s=0;for(let i=f;i<f+p;i++)s+=a[i];o[f+p-1]=s/p;for(let i=f+p;i<a.length;i++)o[i]=a[i]*k+o[i-1]*(1-k);return o}
function rsi(c,p=14){const o=Array(c.length).fill(NaN);if(c.length<=p)return o;let g=0,l=0;
 for(let i=1;i<=p;i++){const d=c[i]-c[i-1];d>0?g+=d:l-=d}g/=p;l/=p;o[p]=100-100/(1+g/(l||1e-9));
 for(let i=p+1;i<c.length;i++){const d=c[i]-c[i-1];g=(g*(p-1)+Math.max(d,0))/p;l=(l*(p-1)+Math.max(-d,0))/p;o[i]=100-100/(1+g/(l||1e-9))}return o}
function macd(c){const a=ema(c,12),b=ema(c,26),m=c.map((_,i)=>a[i]-b[i]),s=ema(m,9);return{m,s,h:m.map((v,i)=>v-s[i])}}
function atr(cs,p=14){const o=Array(cs.length).fill(NaN);if(cs.length<=p)return o;const tr=cs.map((x,i)=>i?Math.max(x.h-x.l,Math.abs(x.h-cs[i-1].c),Math.abs(x.l-cs[i-1].c)):x.h-x.l);
 let a=0;for(let i=1;i<=p;i++)a+=tr[i];a/=p;o[p]=a;for(let i=p+1;i<cs.length;i++){a=(a*(p-1)+tr[i])/p;o[i]=a}return o}
function boll(c,p=20,k=2){const u=[],m=[],l=[],w=[];for(let i=0;i<c.length;i++){if(i<p-1){u.push(NaN);m.push(NaN);l.push(NaN);w.push(NaN);continue}
 const s=c.slice(i-p+1,i+1),mu=s.reduce((x,y)=>x+y)/p,sd=Math.sqrt(s.reduce((x,y)=>x+(y-mu)**2,0)/p);u.push(mu+k*sd);m.push(mu);l.push(mu-k*sd);w.push(2*k*sd/mu)}return{u,m,l,w}}

/* ---------- Candlestick patterns ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
function detect(cs,i,A){const r=[],x=cs[i],p=cs[i-1],q=cs[i-2];if(!x)return r;
 const rg=x.h-x.l||1e-9,bd=Math.abs(x.c-x.o),up=x.h-Math.max(x.o,x.c),lo=Math.min(x.o,x.c)-x.l,bull=x.c>x.o;
 const dtr=i>=3&&cs[i-3].c>x.c,utr=i>=3&&cs[i-3].c<x.c,add=(n,d,s)=>r.push({name:n,dir:d,str:+clamp(s).toFixed(2),i});
 const doji=bd<0.1*rg;let shaped=false;
 if(doji){if(lo>=0.6*rg&&up<=0.1*rg){add("Dragonfly Doji","bull",.6+lo/rg*.3);shaped=true}
  else if(up>=0.6*rg&&lo<=0.1*rg){add("Gravestone Doji","bear",.6+up/rg*.3);shaped=true}else add("Doji","neutral",.4)}
 else{if(lo>=2*bd&&up<=0.5*bd){if(dtr){add("Hammer","bull",.5+Math.min(lo/bd,6)/12);shaped=true}else if(utr){add("Hanging Man","bear",.45);shaped=true}}
  if(up>=2*bd&&lo<=0.5*bd){if(utr){add("Shooting Star","bear",.5+Math.min(up/bd,6)/12);shaped=true}else if(dtr){add("Inverted Hammer","bull",.45);shaped=true}}}
 if(!shaped&&!doji&&bd>0){if(lo>=2*bd&&lo>=0.6*rg)add("Bullish Pin Bar","bull",.5+lo/rg*.3);else if(up>=2*bd&&up>=0.6*rg)add("Bearish Pin Bar","bear",.5+up/rg*.3)}
 if(p){const pb=Math.abs(p.c-p.o),pbull=p.c>p.o;
  if(!pbull&&bull&&x.o<=p.c&&x.c>=p.o&&bd>pb)add("Bullish Engulfing","bull",.6+Math.min(bd/(pb||1e-9),3)/8);
  if(pbull&&!bull&&x.o>=p.c&&x.c<=p.o&&bd>pb)add("Bearish Engulfing","bear",.6+Math.min(bd/(pb||1e-9),3)/8);
  if(x.h<p.h&&x.l>p.l)add("Inside Bar","neutral",.35);
  const tol=0.05*(A||rg);
  if(pbull&&!bull&&Math.abs(x.h-p.h)<=tol)add("Tweezer Top","bear",.55);
  if(!pbull&&bull&&Math.abs(x.l-p.l)<=tol)add("Tweezer Bottom","bull",.55)}
 if(q&&p){const qb=Math.abs(q.c-q.o),pb=Math.abs(p.c-p.o),qm=(q.o+q.c)/2;
  if(q.c<q.o&&qb>0.5*(A||qb)&&pb<0.4*qb&&bull&&x.c>qm)add("Morning Star","bull",.75);
  if(q.c>q.o&&qb>0.5*(A||qb)&&pb<0.4*qb&&!bull&&x.c<qm)add("Evening Star","bear",.75);
  const b3=[q,p,x];
  if(b3.every(k=>k.c>k.o)&&q.c<p.c&&p.c<x.c&&p.o>q.o&&p.o<q.c&&x.o>p.o&&x.o<p.c)add("Three White Soldiers","bull",.8);
  if(b3.every(k=>k.c<k.o)&&q.c>p.c&&p.c>x.c&&p.o<q.o&&p.o>q.c&&x.o<p.o&&x.o>p.c)add("Three Black Crows","bear",.8)}
 return r}

/* ---------- Analysis engine ---------- */
const sg=n=>isNaN(n)?0:n>0?1:n<0?-1:0;
function analyze(cs){
 const c=cs.map(x=>x.c),n=c.length,L=n-1,E20=ema(c,20),E50=ema(c,50),E200=ema(c,200),R=rsi(c),M=macd(c),AT=atr(cs),B=boll(c),px=c[L],A=AT[L];
 // patterns on last 10 candles
 const pats=[];for(let i=Math.max(2,n-10);i<n;i++)pats.push(...detect(cs,i,AT[i]));
 // levels from swing points
 const sw=cs.slice(-80),hi=[],lw=[];for(let i=2;i<sw.length-2;i++){const k=sw[i];
  if(k.h>=Math.max(sw[i-1].h,sw[i-2].h,sw[i+1].h,sw[i+2].h))hi.push(k.h);if(k.l<=Math.min(sw[i-1].l,sw[i-2].l,sw[i+1].l,sw[i+2].l))lw.push(k.l)}
 const rec=cs.slice(-20),res=hi.filter(v=>v>px).sort((a,b)=>a-b)[0]??Math.max(...rec.map(k=>k.h)),sup=lw.filter(v=>v<px).sort((a,b)=>b-a)[0]??Math.min(...rec.map(k=>k.l));
 const pv=(cs[L-1].h+cs[L-1].l+cs[L-1].c)/3;
 // component scores in [-1,1]
 let t=0,tn=0;[[px,E20[L]],[E20[L],E50[L]],[E50[L],E200[L]]].forEach(([a,b])=>{if(!isNaN(a)&&!isNaN(b)){t+=sg(a-b);tn++}});t=tn?t/tn:0;
 const mac=clamp(sg(M.h[L])*.5+(M.h[L]>M.h[L-1]?.25:-.25)+(M.m[L]>0?.25:-.25),-1,1);
 const rsiS=isNaN(R[L])?0:R[L]<30?.8:R[L]>70?-.8:(R[L]-50)/50;
 const mom=.6*mac+.4*rsiS;
 let ps=0;pats.forEach(p=>{const w=.5+.5*(p.i-(n-10))/9;ps+=(p.dir==="bull"?1:p.dir==="bear"?-1:0)*p.str*w});ps=Math.tanh(ps/1.5);
 const pb=(px-B.l[L])/((B.u[L]-B.l[L])||1e-9);let lv=0;if(!isNaN(pb))lv=clamp(.5-pb,-.5,.5)*-0+(pb<.15?.7:pb>.85?-.7:0);
 const dS=Math.abs(px-sup),dR=Math.abs(res-px);lv+=dS<A?.5:dR<A?-.5:0;lv=clamp(lv,-1,1);
 const comp=.3*t+.25*mom+.25*ps+.2*lv,buy=Math.round(clamp(50+50*comp,0,100));
 const sgn=[t,mom,ps,lv].map(sg),agree=sgn.filter(s=>s===sg(comp)&&s!==0).length/4;
 const conf=Math.round(clamp(100*(.55*Math.min(Math.abs(comp)*2,1)+.45*agree),0,100));
 const bias=comp>0.12?"Bullish":comp<-0.12?"Bearish":"Neutral";
 // upward-push predictor
 let pp=20;const why=[],recent=pats.filter(p=>p.i>=n-3&&p.dir==="bull"&&["Hammer","Bullish Engulfing","Morning Star","Bullish Pin Bar","Dragonfly Doji","Three White Soldiers","Tweezer Bottom"].includes(p.name));
 if(recent.length){const b=recent.sort((a,b)=>b.str-a.str)[0];pp+=22*b.str+6;why.push(b.name+" on a recent candle")}
 const rmin=Math.min(...R.slice(-5).filter(v=>!isNaN(v)));if(R[L]>R[L-1]&&rmin<40){pp+=15;why.push("RSI turning up from "+rmin.toFixed(0))}
 if([L,L-1,L-2].some(i=>M.m[i]>M.s[i]&&M.m[i-1]<=M.s[i-1])){pp+=15;why.push("MACD bullish crossover")}
 if(dS<A*1.2||pb<.2){pp+=14;why.push("price holding near support / lower Bollinger Band")}
 const wmin=Math.min(...B.w.slice(-30).filter(v=>!isNaN(v)));if(B.w[L-1]<=wmin*1.25&&AT[L]>AT[L-1]){pp+=10;why.push("ATR expanding after a squeeze")}
 if(t>0.3){pp+=10;why.push("bullish EMA alignment")}
 pp=Math.round(clamp(pp,3,95));const longC=pp>=55;
 const top=[["Trend",t*.3],["Momentum",mom*.25],["Patterns",ps*.25],["Levels/Bands",lv*.2]].sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0,3).map(s=>s[0]+" ("+(s[1]>0?"bullish":s[1]<0?"bearish":"flat")+")");
 const keyP=pats.filter(p=>p.dir!=="neutral").sort((a,b)=>b.str-a.str)[0]||pats[0];
 const f=v=>v>=100?v.toFixed(2):v.toFixed(5);
 let dir=buy>=56?"BUY":buy<=44?"SELL":"WAIT";if(conf<30)dir="WAIT";let trade=null;
 if(dir==="BUY"){const sl=Math.max(Math.min(px-1.5*A,sup-.25*A),px-3*A);trade={entry:px,sl,tp:px+2*(px-sl),rr:2}}
 if(dir==="SELL"){const sl=Math.min(Math.max(px+1.5*A,res+.25*A),px+3*A);trade={entry:px,sl,tp:px-2*(sl-px),rr:2}}
 const text=`Overall bias is ${bias.toLowerCase()} with ${buy}% buy vs ${100-buy}% sell pressure at ${conf}% confidence. The strongest drivers are ${top.join(", ")}. `+
  (keyP?`The most notable candlestick is a ${keyP.name} (${keyP.dir}, strength ${keyP.str}). `:"No significant candlestick pattern appeared in the last 10 candles. ")+
  `There is roughly a ${pp}% chance of an upward push next candle${why.length?" because of "+why.join(", "):", with few supporting signals"}. `+
  `Risk note: watch resistance near ${f(res)} and support near ${f(sup)}. Probabilities are rule-based estimates, not guarantees.`;
 return{dir,trade,buy,sell:100-buy,conf,bias,pp,longC,why,pats,sup,res,pv,text,E20,E50,B,price:px,rsi:R[L],ts:new Date()}}

/* ---------- Self-test against known examples ---------- */
function selfTest(){const dn=[110,108,106].map(v=>({o:v+1,h:v+1.5,l:v-.5,c:v}));let ok=0;
 const names=a=>a.map(p=>p.name);
 if(names(detect([{o:100,h:105,l:95,c:100.5}],0,2)).includes("Doji"))ok++;
 if(names(detect([...dn,{o:100,h:101.2,l:95,c:101}],3,2)).includes("Hammer"))ok++;
 if(names(detect([{o:102,h:102.5,l:100,c:100.5},{o:100,h:103.5,l:99.8,c:103}],1,2)).includes("Bullish Engulfing"))ok++;
 return ok+"/3"}

/* ---------- Data ---------- */
const TFMIN={"1m":1,"5m":5,"15m":15,"1H":60,"4H":240,"1D":1440},BASE={XAUUSD:2650,EURUSD:1.08,GBPUSD:1.27,USDJPY:150,BTCUSD:68000};
function demo(){let s=7,r=()=>(s=(s*16807)%2147483647)/2147483647,p=BASE[$("pair").value],m=TFMIN[$("tf").value],t=Date.now()-300*m*6e4,v=p*.0015*Math.sqrt(m/15+1),out=[],d=0;
 for(let i=0;i<300;i++){if(i%40===0)d=(r()-.5)*v*.5;const o=p,c=p+d+(r()-.5)*v*2,h=Math.max(o,c)+r()*v*.8,l=Math.min(o,c)-r()*v*.8;out.push({ts:Math.floor((t+i*m*6e4)/1000),t:new Date(t+i*m*6e4).toLocaleString(),o,h,l,c,v:Math.round(r()*1e3)});p=c}return out}
function parseCSV(txt){const rows=txt.trim().split(/\r?\n/).map(l=>l.split(/[,;\t]/).map(x=>x.trim()));if(!rows.length)return[];
 let h=rows[0].map(x=>x.toLowerCase()),hasH=isNaN(parseFloat(h[1])),ix={t:0,o:1,h:2,l:3,c:4,v:5};
 if(hasH){const f=(...k)=>h.findIndex(x=>k.some(y=>x.startsWith(y)));ix={t:f("time","date","dt"),o:f("o"),h:f("h"),l:f("l"),c:f("c"),v:f("vol")};rows.shift()}
 if(hasH&&(ix.o<0||ix.h<0||ix.l<0||ix.c<0))return[];
 return rows.map(r=>({t:r[ix.t]||"",o:+r[ix.o],h:+r[ix.h],l:+r[ix.l],c:+r[ix.c],v:+r[ix.v]||0})).filter(k=>[k.o,k.h,k.l,k.c].every(isFinite))}

/* ---------- Chart (canvas) ---------- */
let LW=null,S={lines:[]},fitted=false;
function initLW(){if(LW)return;LW=LightweightCharts.createChart($("lw"),{autoSize:true,layout:{background:{color:"#141a21"},textColor:"#8795a3"},grid:{vertLines:{color:"#1c242d"},horzLines:{color:"#1c242d"}},timeScale:{timeVisible:true,secondsVisible:false},rightPriceScale:{borderColor:"#232c36"}});
 S.c=LW.addCandlestickSeries({upColor:"#2fc48d",downColor:"#ef5a5a",borderVisible:false,wickUpColor:"#2fc48d",wickDownColor:"#ef5a5a"});
 const ls=(col,w)=>LW.addLineSeries({color:col,lineWidth:w,priceLineVisible:false,lastValueVisible:false});
 S.e20=ls("#e3b341",2);S.e50=ls("#6aa9ff",2);S.bu=ls("rgba(135,149,163,.6)",1);S.bl=ls("rgba(135,149,163,.6)",1)}
function draw(){if(!window.LightweightCharts||!candles.length)return;initLW();
 const T=candles.map((k,i)=>k.ts||Date.parse(k.t)/1000||1e9+i*60);
 S.c.setData(candles.map((k,i)=>({time:T[i],open:k.o,high:k.h,low:k.l,close:k.c})));
 if(!fitted){LW.timeScale().fitContent();fitted=true}
 S.lines.forEach(l=>S.c.removePriceLine(l));S.lines=[];
 if(!lastAn){[S.e20,S.e50,S.bu,S.bl].forEach(x=>x.setData([]));S.c.setMarkers([]);return}
 const a=lastAn,ln=arr=>arr.map((v,i)=>isNaN(v)?null:{time:T[i],value:v}).filter(Boolean);
 S.e20.setData(ln(a.E20));S.e50.setData(ln(a.E50));S.bu.setData(ln(a.B.u));S.bl.setData(ln(a.B.l));
 const pl=(price,color,title,st)=>S.lines.push(S.c.createPriceLine({price,color,lineWidth:2,lineStyle:st,axisLabelVisible:true,title}));
 pl(a.sup,"#2fc48d","Support",2);pl(a.res,"#ef5a5a","Resistance",2);
 if(a.trade){pl(a.trade.entry,"#e6ebf0","ENTRY",0);pl(a.trade.sl,"#ef5a5a","SL",0);pl(a.trade.tp,"#2fc48d","TP",0)}
 S.c.setMarkers(a.pats.filter(p=>p.dir!=="neutral").map(p=>({time:T[p.i],position:p.dir==="bull"?"belowBar":"aboveBar",color:p.dir==="bull"?"#2fc48d":"#ef5a5a",shape:p.dir==="bull"?"arrowUp":"arrowDown",text:p.name})))}
function drawUnused(){const cv=$("cv"),dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext("2d");g.scale(dpr,dpr);g.clearRect(0,0,W,H);
 if(!candles.length){g.fillStyle="#8795a3";g.font="14px sans-serif";g.fillText("No data loaded",16,28);return}
 const N=Math.min(90,candles.length),off=candles.length-N,vis=candles.slice(-N),a=lastAn;
 let mx=Math.max(...vis.map(k=>k.h)),mn=Math.min(...vis.map(k=>k.l));if(a){mx=Math.max(mx,a.res);mn=Math.min(mn,a.sup)}
 const pad=(mx-mn)*.06;mx+=pad;mn-=pad;const pl=8,pr=62,pt=12,pb=18,cw=(W-pl-pr)/N,Y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb),X=i=>pl+(i+.5)*cw;
 g.font="11px sans-serif";g.fillStyle="#8795a3";g.strokeStyle="#232c36";
 for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,y=Y(v);g.beginPath();g.moveTo(pl,y);g.lineTo(W-pr,y);g.stroke();g.fillText(v>=100?v.toFixed(2):v.toFixed(4),W-pr+4,y+4)}
 const line=(arr,col)=>{g.beginPath();g.strokeStyle=col;let s=false;for(let i=0;i<N;i++){const v=arr[off+i];if(isNaN(v)){continue}s?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v));s=true}g.stroke()};
 if(a){line(a.B.u,"rgba(135,149,163,.5)");line(a.B.l,"rgba(135,149,163,.5)");line(a.E20,"#e3b341");line(a.E50,"#6aa9ff")}
 vis.forEach((k,i)=>{const up=k.c>=k.o,col=up?"#2fc48d":"#ef5a5a";g.strokeStyle=g.fillStyle=col;g.beginPath();g.moveTo(X(i),Y(k.h));g.lineTo(X(i),Y(k.l));g.stroke();
  const y1=Y(Math.max(k.o,k.c)),y2=Y(Math.min(k.o,k.c));g.fillRect(X(i)-cw*.35,y1,cw*.7,Math.max(1,y2-y1))});
 if(a){[[a.res,"#ef5a5a","R"],[a.sup,"#2fc48d","S"],[a.pv,"#8795a3","P"]].forEach(([v,col,t])=>{g.setLineDash([5,4]);g.strokeStyle=col;g.beginPath();g.moveTo(pl,Y(v));g.lineTo(W-pr,Y(v));g.stroke();g.setLineDash([]);g.fillStyle=col;g.fillText(t,pl+2,Y(v)-3)});
  a.pats.filter(p=>p.i>=off&&p.dir!=="neutral").forEach(p=>{const x=X(p.i-off);g.fillStyle=p.dir==="bull"?"#2fc48d":"#ef5a5a";g.fillText(p.dir==="bull"?"▲":"▼",x-4,p.dir==="bull"?Y(candles[p.i].l)+13:Y(candles[p.i].h)-4)})}}

/* ---------- Render ---------- */
const fm=v=>v>=100?v.toFixed(2):v.toFixed(5),esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function render(a){const pair=$("pair").value,tf=$("tf").value,cls=a.bias==="Bullish"?"up":a.bias==="Bearish"?"dn":"mu";
 const rows=a.pats.length?a.pats.slice().reverse().map(p=>{const k=candles[p.i];return`<tr><td>${p.name}</td><td class="${p.dir==="bull"?"up":p.dir==="bear"?"dn":"mu"}">${p.dir}</td><td>${p.str.toFixed(2)}</td><td>${esc(k.t||"#"+p.i)}</td></tr>`}).join(""):`<tr><td colspan="4" class="mu">No patterns in the last 10 candles</td></tr>`;
 $("out").innerHTML=`<div class="row"><b>${pair} · ${tf}</b><span class="mu">${source}</span></div>
 <div class="verdict ${a.dir}" style="margin-top:10px">${a.dir==="WAIT"?"WAIT: no clear edge":a.dir+" "+pair}</div>
 ${a.trade?`<div class="row"><span>Entry</span><b>${fm(a.trade.entry)}</b></div><div class="row"><span>Stop loss</span><b class="dn">${fm(a.trade.sl)}</b></div><div class="row"><span>Take profit</span><b class="up">${fm(a.trade.tp)}</b></div><div class="row"><span>Risk : reward</span><b>1 : ${a.trade.rr}</b></div>`:""}
 <h2 style="margin-top:10px">Buy vs sell</h2><div class="bar"><div id="bb" style="width:${a.buy}%">${a.buy}% BUY</div><div id="sb" style="width:${a.sell}%">${a.sell}% SELL</div></div>
 <h2 style="margin-top:12px">Confidence ${a.conf}%</h2><div class="gauge"><div style="width:${a.conf}%"></div></div>
 <h2 style="margin-top:12px">Market direction forecast</h2>
 <div class="row"><span>Bias</span><b class="${cls}">${a.bias}</b></div>
 <div class="row"><span>Upward-push probability</span><b>${a.pp}%</b></div>
 <div class="row"><span>Long bullish candle likely?</span><b class="${a.longC?"up":"mu"}">${a.longC?"Yes":"No"}</b></div>
 <div class="mu" style="font-size:12.5px">${a.why.length?"Because: "+esc(a.why.join("; ")):"Few supporting signals present."}</div>
 <h2 style="margin-top:12px">Detected patterns</h2><div class="scroll"><table><tr><th>Pattern</th><th>Dir</th><th>Strength</th><th>Time</th></tr>${rows}</table></div>
 <h2 style="margin-top:12px">Key levels</h2>
 <div class="row"><span>Resistance</span><b class="dn">${fm(a.res)}</b></div><div class="row"><span>Pivot</span><b>${fm(a.pv)}</b></div><div class="row"><span>Support</span><b class="up">${fm(a.sup)}</b></div>
 <h2 style="margin-top:12px">AI reasoning</h2><div style="font-size:13px">${esc(a.text)}</div>
 <div class="mu" style="margin-top:10px;font-size:12px">Analyzed ${a.ts.toLocaleString()}<br>This is AI-generated technical analysis for educational purposes only, not financial advice.</div>`}
function run(){if(!candles.length){$("out").innerHTML='<div class="warn">No data loaded. Upload an OHLC CSV or load demo data first.</div>';lastAn=null;draw();return}
 if(candles.length<50){$("out").innerHTML=`<div class="warn">Only ${candles.length} candles loaded. At least 50 are needed for a reliable signal, so no analysis is shown.</div>`;lastAn=null;draw();return}
 try{lastAn=analyze(candles);render(lastAn);draw()}catch(e){$("out").innerHTML='<div class="warn">Analysis failed: '+esc(e.message)+'</div>'}}

$("go").onclick=go;
$("demo").onclick=()=>{stopLive();candles=demo();source="SIMULATED DEMO DATA";run()};
$("csv").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const d=parseCSV(String(r.result));if(!d.length){$("out").innerHTML='<div class="warn">Could not read that file. Use columns: time, open, high, low, close, volume.</div>';return}stopLive();candles=d;source="CSV: "+f.name;run()};r.readAsText(f)};
$("pair").onchange=$("tf").onchange=()=>{if(source.startsWith("SIMULATED")){candles=demo();run()}else go()};
let timer=null;$("auto").onchange=e=>{clearInterval(timer);if(e.target.checked)timer=setInterval(()=>{if(source.startsWith("SIMULATED")){candles=demo();run()}else go()},60000)};

$("foot").textContent="Candlestick self-test (Doji, Hammer, Engulfing): "+selfTest()+" passed. Chart: TradingView. Candles: free Binance market data (gold via PAXG, which tracks spot gold closely) and Yahoo for USDJPY. Prices can differ slightly from your broker.";

/* ---------- Live market connection (free, no API key) ---------- */
const TVSYM={XAUUSD:"OANDA:XAUUSD",EURUSD:"OANDA:EURUSD",GBPUSD:"OANDA:GBPUSD",USDJPY:"OANDA:USDJPY",BTCUSD:"BINANCE:BTCUSDT"};
const TVINT={"1m":"1","5m":"5","15m":"15","1H":"60","4H":"240","1D":"D"},BNINT={"1m":"1m","5m":"5m","15m":"15m","1H":"1h","4H":"4h","1D":"1d"};
const BN={XAUUSD:"PAXGUSDT",EURUSD:"EURUSDT",GBPUSD:"GBPUSDT",BTCUSD:"BTCUSDT"};
let tvKey="",tabN=1,ws=null,wsTok=0,pollT=null,rt=null;
function tab(n){tabN=n;$("lw").style.display=n===1?"block":"none";$("tv").style.display=n===2?"block":"none";if(n===2){tvKey="";loadTV()}}
$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);
function loadTV(){const p=$("pair").value,tf=$("tf").value,k=p+tf;if(k===tvKey)return;tvKey=k;
 const mk=()=>{$("tv").innerHTML="";new TradingView.widget({autosize:true,symbol:TVSYM[p],interval:TVINT[tf],timezone:"Etc/UTC",theme:"dark",style:"1",locale:"en",container_id:"tv",allow_symbol_change:false,studies:["MAExp@tv-basicstudies","RSI@tv-basicstudies","MACD@tv-basicstudies","BB@tv-basicstudies"]})};
 if(window.TradingView)mk();else{const sc=document.createElement("script");sc.src="https://s3.tradingview.com/tv.js";sc.onload=mk;sc.onerror=()=>{$("tv").textContent="TradingView failed to load. Check your connection."};document.head.appendChild(sc)}}
async function yahoo(tf){const iv={"1m":"1m","5m":"5m","15m":"15m","1H":"60m","4H":"60m","1D":"1d"}[tf],rg={"1m":"5d","5m":"1mo","15m":"1mo","1H":"3mo","4H":"6mo","1D":"2y"}[tf];
 const u="https://query1.finance.yahoo.com/v8/finance/chart/JPY=X?interval="+iv+"&range="+rg,r=await fetch("https://corsproxy.io/?"+encodeURIComponent(u));
 if(!r.ok)throw new Error("USDJPY feed unavailable ("+r.status+"). Try XAUUSD, EURUSD, GBPUSD or BTCUSD.");
 const j=(await r.json()).chart.result[0],q=j.indicators.quote[0];let a=[];
 j.timestamp.forEach((t,i)=>{if(q.close[i]!=null)a.push({ts:t,t:new Date(t*1000).toLocaleString(),o:q.open[i],h:q.high[i],l:q.low[i],c:q.close[i],v:q.volume[i]||0})});
 if(tf==="4H"){const m={};a.forEach(k=>{const b=Math.floor(k.ts/14400)*14400,x=m[b];if(!x)m[b]={...k,ts:b,t:new Date(b*1000).toLocaleString()};else{x.h=Math.max(x.h,k.h);x.l=Math.min(x.l,k.l);x.c=k.c}});a=Object.values(m)}
 return a}
async function fetchLive(){const p=$("pair").value,tf=$("tf").value;if(!BN[p])return yahoo(tf);let r;
 for(const h of ["data-api.binance.vision","api.binance.com"]){try{r=await fetch("https://"+h+"/api/v3/klines?symbol="+BN[p]+"&interval="+BNINT[tf]+"&limit=500");if(r.ok)break}catch(e){}}
 if(!r||!r.ok)throw new Error("Could not reach Binance market data. Check your internet or VPN, then press Analyze Now again.");
 return(await r.json()).map(k=>({ts:k[0]/1000,t:new Date(k[0]).toLocaleString(),o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]}))}
function stopLive(){wsTok++;if(ws){ws.close();ws=null}clearInterval(pollT)}
function live(){stopLive();const p=$("pair").value,tf=$("tf").value,tok=wsTok;
 if(!BN[p]){pollT=setInterval(async()=>{try{candles=await fetchLive();run()}catch(e){}},20000);return}
 const open=()=>{if(tok!==wsTok)return;ws=new WebSocket("wss://data-stream.binance.vision/ws/"+BN[p].toLowerCase()+"@kline_"+BNINT[tf]);
  ws.onmessage=e=>{const k=JSON.parse(e.data).k,c={ts:k.t/1000,t:new Date(k.t).toLocaleString(),o:+k.o,h:+k.h,l:+k.l,c:+k.c,v:+k.v},L=candles[candles.length-1];
   if(L&&L.ts===c.ts)candles[candles.length-1]=c;else if(L&&c.ts>L.ts)candles.push(c);else return;
   if(S.c)S.c.update({time:c.ts,open:c.o,high:c.h,low:c.l,close:c.c});
   if(!rt)rt=setTimeout(()=>{rt=null;if(tok===wsTok)run()},3000)};
  ws.onclose=()=>{if(tok===wsTok)setTimeout(open,3000)}};open()}
async function go(){if(tabN===2)loadTV();fitted=false;if(!lastAn)$("out").innerHTML='<div class="warn">Fetching live candles…</div>';
 try{candles=await fetchLive();source="LIVE · "+(BN[$("pair").value]?"Binance":"Yahoo");run();live()}catch(e){$("out").innerHTML='<div class="warn">'+esc(e.message)+'</div>'}}
go();
</script>
