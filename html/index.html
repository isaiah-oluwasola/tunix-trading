<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noarchive">
<title>AI Chart Analyzer</title>
<link rel="stylesheet" href="../css/style.min.css">
</head>
<body>
<header>
  <h1>AI Chart Analyzer</h1>
  <select id="pair" aria-label="Pair"><option>XAUUSD</option><option>EURUSD</option><option>GBPUSD</option><option>USDJPY</option><option>BTCUSD</option></select>
  <select id="tf" aria-label="Timeframe"><option>1m</option><option>5m</option><option selected>15m</option><option>1H</option><option>4H</option><option>1D</option></select>
  <button class="go" id="go">Analyze Now</button>
  <label class="btn">Upload OHLC CSV<input type="file" id="csv" accept=".csv,.txt"></label>
  <button id="demo">Load demo data</button>
  <label class="mu"><input type="checkbox" id="auto"> Auto every 60s</label>
</header>
<main>
  <section class="card" id="chartwrap"><canvas id="cv"></canvas></section>
  <aside id="side"><div class="card" id="out"><div class="warn">Upload a CSV of OHLC candles (time, open, high, low, close, volume) or load demo data, then press Analyze Now.</div></div></aside>
</main>
<footer id="foot"></footer>
<script src="../js/guard.min.js"></script>
<script src="../js/app.min.js"></script>
</body>
</html>
